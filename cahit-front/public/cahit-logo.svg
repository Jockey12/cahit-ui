<svg
  viewBox="0 0 360 340"
  width="360"
  height="340"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00D4FF" />
      <stop offset="60%"  stop-color="#7B61FF" />
      <stop offset="100%" stop-color="#9F4EFF" />
    </linearGradient>

    <filter id="barGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="360" height="340" fill="#07091A" />

  <!-- Tile border -->
  <rect
    x="120" y="32" width="120" height="150" rx="14"
    fill="none"
    stroke="#1A2040"
    stroke-width="1"
    opacity="0.5"
  />

  <!-- C-mark: 5 horizontal bars, left-aligned -->
  <g filter="url(#barGlow)">
    <rect x="130" y="50"  width="96" height="14" rx="7" fill="url(#barGrad)" />
    <rect x="130" y="74"  width="58" height="14" rx="7" fill="url(#barGrad)" opacity="0.88" />
    <rect x="130" y="98"  width="42" height="14" rx="7" fill="url(#barGrad)" opacity="0.72" />
    <rect x="130" y="122" width="58" height="14" rx="7" fill="url(#barGrad)" opacity="0.88" />
    <rect x="130" y="146" width="96" height="14" rx="7" fill="url(#barGrad)" />
  </g>

  <!-- Wordmark -->
  <text
    x="180" y="228"
    text-anchor="middle"
    font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, system-ui, sans-serif"
    font-size="52"
    font-weight="600"
    letter-spacing="10"
    fill="#EEF2FF"
    filter="url(#textGlow)"
  >Cahit</text>

  <!-- Tagline -->
  <text
    x="180" y="264"
    text-anchor="middle"
    font-family="'Inter', system-ui, sans-serif"
    font-size="12"
    font-weight="400"
    letter-spacing="5"
    fill="#3D4E7A"
  >LLM FRONTEND</text>

  <!-- Separator -->
  <line
    x1="148" y1="248" x2="212" y2="248"
    stroke="#1A2040"
    stroke-width="1"
    opacity="0.6"
  />
</svg>
